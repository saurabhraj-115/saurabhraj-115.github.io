<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saurabh Raj — Product & Technology · Strategy & Consulting</title>
  <meta name="description" content="Saurabh Raj — AI Product Manager and Product & Strategy Leader, MBA candidate at UVA Darden. Choose a path: Technology or Strategy.">
  <link rel="canonical" href="https://saurabhraj-115.github.io/">
  <meta name="theme-color" content="#0a0e17">
  <meta property="og:title" content="Saurabh Raj — Two paths: Technology & Strategy">
  <meta property="og:description" content="AI Product Manager · Product & Strategy Leader · UVA Darden MBA. Choose your path.">
  <meta property="og:url" content="https://saurabhraj-115.github.io/">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden; background: #0a0e17;
      animation: fade .8s ease both;
    }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    a { text-decoration: none; color: inherit; }

    .gate { display: flex; height: 100vh; height: 100dvh; }

    .panel {
      flex: 1; position: relative; overflow: hidden; cursor: pointer;
      display: grid; place-items: center; text-align: center;
      transition: flex .7s cubic-bezier(.7,0,.15,1);
    }
    /* hover expand (desktop) */
    @media (hover: hover) and (min-width: 821px) {
      .gate:hover .panel { flex: .82; }
      .gate .panel:hover { flex: 1.36; }
      .panel:hover .enter { gap: 16px; opacity: 1; }
      .panel:hover .art { opacity: 1; transform: scale(1.04); }
    }

    .inner { position: relative; z-index: 3; padding: 40px; max-width: 460px; }
    .eyebrow { font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; font-weight: 600; margin-bottom: 22px; }
    .panel h2 { line-height: 1.02; margin-bottom: 20px; }
    .desc { font-size: 1rem; line-height: 1.6; max-width: 24em; margin: 0 auto 30px; }
    .enter {
      display: inline-flex; align-items: center; gap: 10px; font-size: .82rem; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; opacity: .78; transition: gap .3s, opacity .3s;
    }
    .enter svg { width: 22px; height: 12px; }

    /* ── TECH (left, dark) ── */
    .tech { background: #0a0e17; color: #e2e8f0; }
    .tech .art {
      position: absolute; inset: 0; z-index: 1; opacity: .85; transition: opacity .6s, transform .8s;
      background-image:
        radial-gradient(ellipse 70% 55% at 30% 20%, rgba(99,102,241,.22), transparent 60%),
        radial-gradient(ellipse 50% 40% at 75% 85%, rgba(56,189,248,.14), transparent 60%),
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 46px 46px, 46px 46px;
    }
    .tech .eyebrow { color: #818cf8; }
    .tech h2 { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -.03em; font-size: clamp(2.4rem, 5.5vw, 4.4rem); }
    .tech .desc { color: #94a3b8; }
    .tech .enter { color: #a5b4fc; }

    /* ── CONSULTING (right, light) ── */
    .consult { background: #f7f5ef; color: #17203a; }
    .consult .art {
      position: absolute; inset: 0; z-index: 1; opacity: .9; transition: opacity .6s, transform .8s;
      background-image:
        radial-gradient(ellipse 60% 50% at 70% 25%, rgba(154,107,52,.10), transparent 60%),
        radial-gradient(ellipse 55% 45% at 25% 85%, rgba(23,32,58,.05), transparent 60%);
    }
    .consult .eyebrow { color: #9a6b34; }
    .consult h2 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -.01em; font-size: clamp(2.4rem, 5.5vw, 4.6rem); }
    .consult h2 em { font-style: italic; color: #9a6b34; }
    .consult .desc { color: #45506a; }
    .consult .enter { color: #7d5527; }

    /* Divider */
    .gate::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
      background: rgba(154,107,52,.35); z-index: 4; transform: translateX(-50%);
      transition: opacity .5s;
    }
    @media (hover: hover) and (min-width: 821px) { .gate:hover::after { opacity: 0; } }

    /* Name — legible over both halves */
    .brand {
      position: fixed; top: 34px; left: 50%; transform: translateX(-50%); z-index: 20;
      font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(1.3rem, 3vw, 1.9rem);
      color: #fff; mix-blend-mode: difference; letter-spacing: .01em; pointer-events: none; white-space: nowrap;
    }
    .hint {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20;
      font-family: 'Inter', sans-serif; font-size: .68rem; letter-spacing: .26em; text-transform: uppercase;
      color: #fff; mix-blend-mode: difference; pointer-events: none; opacity: .8;
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .gate { flex-direction: column; height: auto; min-height: 100dvh; }
      .panel { min-height: 52vh; flex: none; }
      .enter { opacity: 1; }
      .gate::after { display: none; }
      .brand { top: 22px; }
      .hint { display: none; }
      .inner { padding: 30px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation: none !important; transition: none !important; } }
    .panel:focus-visible { outline: 3px solid #9a6b34; outline-offset: -3px; }
  </style>
</head>
<body>
  <div class="brand">Saurabh Raj</div>

  <main class="gate">
    <a class="panel tech" href="tech/" aria-label="Enter the Technology and AI Product portfolio">
      <div class="art" aria-hidden="true"></div>
      <div class="inner">
        <p class="eyebrow">Product · AI</p>
        <h2>Technology<br>&amp; Product</h2>
        <p class="desc">AI product management — building voice &amp; agentic systems that ship and scale.</p>
        <span class="enter">Enter
          <svg viewBox="0 0 32 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 6h29m0 0l-6-5m6 5l-6 5"/></svg>
        </span>
      </div>
    </a>

    <a class="panel consult" href="consulting/" aria-label="Enter the Strategy and Consulting portfolio">
      <div class="art" aria-hidden="true"></div>
      <div class="inner">
        <p class="eyebrow">Strategy · Leadership</p>
        <h2>Strategy<br>&amp; <em>Consulting</em></h2>
        <p class="desc">Leading teams and building businesses that deliver measurable outcomes.</p>
        <span class="enter">Enter
          <svg viewBox="0 0 32 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 6h29m0 0l-6-5m6 5l-6 5"/></svg>
        </span>
      </div>
    </a>
  </main>

  <div class="hint">Choose a path</div>
</body>
</html>
